[project]
name = "ai-team-docs"
version = "0.1.0"
description = "Up-to-date team docs for AI coding agents: a read-only Confluence sync, hybrid search and an MCP tool."
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "scripts", "mcp"]
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # typographic characters in user-facing text are intended

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests", "mcp"]
testpaths = ["tests"]
