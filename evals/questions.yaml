# Questions for the retrieval and answer evaluation.
#
#   id        q01, q02, ...
#   by        who wrote the question: claude, claude-low-overlap or user. Claude also wrote the docs,
#             so its questions may share their words. claude-low-overlap questions avoid the words
#             of their answer pages (a test checks it), which keeps the keyword search honest.
#   kind      paraphrase: asks in other words than the docs
#             exact: names an identifier (a ticket, an error code, a parameter)
#             multi: needs two pages, or a superseded decision next to the one in force
#             none: the docs do not answer it; a good answer says so
#   question  what an agent or a person would ask
#   pages     titles of the pages that answer it (any of them counts as a hit); empty for none
#             (inside [ ], put a title that has a comma in quotes)
#   facts     what a correct answer must contain. Each item is a string, or a list of strings of
#             which one is enough. Matched without case, as whole words.
#
# tests/test_questions.py checks that every page exists and every fact is in one of its pages.

